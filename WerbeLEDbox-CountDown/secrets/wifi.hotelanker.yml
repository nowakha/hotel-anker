# Hotel Anker WiFi credentials
# WARNING: Secrets are stored in this repository by project request (private handoff).
# Do not publish this repo publicly without removing or rotating these values.

ssid_24ghz: HotelAnker
ssid_5ghz: HotelAnker_5G
password: "HeimatSchutz"
security: WPA2-PSK
notes: >
  Same PSK for 2.4 and 5 GHz.
  AnkerPI02 (Pi 4, NetworkManager): prefer HotelAnker_5G
  (autoconnect-priority 20), fallback HotelAnker (priority 10).
  Both keyfiles under /etc/NetworkManager/system-connections/.
  AnkerPI01 (Pi Zero 2 W): Band 1 only — no 5 GHz hardware.
  Only HotelAnker.nmconnection (priority 20) under /etc/...;
  HotelAnker_5G N/A (SSID not visible / unsupported).
  Powersave disabled (802-11-wireless.powersave=2). DNS pinned
  1.1.1.1/8.8.8.8 ignore-auto-dns. Lesson: nmcli add may only write
  /run (tmpfs) — persist keyfiles under /etc/ then nmcli reload.
