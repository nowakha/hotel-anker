# Hotel Anker WiFi credentials
# WARNING: Secrets are stored in this repository by project request (private handoff).
# Do not publish this repo publicly without removing or rotating these values.

# Staff / Administration (Default LAN 192.168.1.0/24) — AnkerPI01 + AnkerPI02 Heimatnetz
ssid_administration: Administration
password_administration: "HeimatSchutz"

# CountDown Bar (VLAN 2 / 192.168.2.0/24)
ssid_24ghz: HotelAnker
ssid_5ghz: HotelAnker_5G
password: "HeimatSchutz"

# UniFi live 2026-07-29: Administration + HotelAnker = WPA2/WPA3 Transition, PMF optional.
# Never set Administration to WPA3-only — Pi Zero 2 W cannot do SAE reliably.
security: WPA2-WPA3-Transition
notes: >
  Same PSK («HeimatSchutz») for Administration and HotelAnker.
  Soll: AnkerPI01/02 on Administration (192.168.1.x), not Bar VLAN.
  AnkerPI01 (Pi Zero 2 W / CYW43436): 2.4 GHz only; NM key-mgmt=wpa-psk (not sae).
  AnkerPI02 (Pi 4): Administration preferred; HotelAnker/_5G low-prio fallback.
  Persist NM keyfiles under /etc/NetworkManager/system-connections/ then nmcli reload.
  Powersave disabled (802-11-wireless.powersave=2). DNS 1.1.1.1/8.8.8.8 ignore-auto-dns.
  Migrate: scripts/migrate_pis_to_administration_wifi.py (UDM jump or Tailscale).
  Docs: docs/NETWORK_UNIFI.md § WPA3 / Pi Zero 2 W.
