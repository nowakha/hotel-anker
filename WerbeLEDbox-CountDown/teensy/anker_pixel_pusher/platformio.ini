; Anker Kendu Control Blok — Teensy 8×512 WS2812 receiver
; Protocol: ANKR frames (same as Pico)

[env]
platform = teensy
framework = arduino
lib_deps = paulstoffregen/OctoWS2811
build_flags = -DUSB_SERIAL
monitor_speed = 115200

; Teensy 3.1 / 3.2 (MK20DX256) — OctoWS2811 pins fixed
[env:teensy32]
board = teensy31
build_flags =
	${env.build_flags}
	-DANKER_MCU_NAME=\"TEENSY32\"

; Teensy 4.0 (IMXRT1062)
[env:teensy40]
board = teensy40
build_flags =
	${env.build_flags}
	-DANKER_MCU_NAME=\"TEENSY40\"

; Teensy 4.1 (IMXRT1062, longer board + onboard SD — unlikely on this carrier)
[env:teensy41]
board = teensy41
build_flags =
	${env.build_flags}
	-DANKER_MCU_NAME=\"TEENSY41\"
